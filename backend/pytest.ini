[pytest]
asyncio_mode = auto
# Session-scoped, matching the session-scoped fixtures in tests/conftest.py.
# This is the supported replacement for overriding the `event_loop` fixture,
# which pytest-asyncio deprecated and which deadlocked the whole suite — see
# the comment in conftest.py where that override used to live.
asyncio_default_fixture_loop_scope = session
testpaths = tests
